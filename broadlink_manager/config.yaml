name: "Broadlink Manager"
version: "0.2.0"
slug: "broadlink_manager"
description: "Learn, store and test Broadlink RF/IR codes, then turn them into Home Assistant entities"
url: "https://github.com/aasayag-hash/ha-broadlink-manager"
arch:
  - amd64
  - aarch64
  - armv7
init: false
ingress: true
ingress_port: 8099
panel_icon: mdi:remote
panel_title: "Broadlink"
hassio_api: true
homeassistant_api: true
# host_network: Broadlink discovery is a UDP broadcast. Inside the add-on's bridge
# network the broadcast never reaches the LAN, so no device is ever found.
host_network: true
# config:rw: learned codes live in /config/.storage/broadlink_remote_<mac>_codes,
# the same file Home Assistant reads, so remote.send_command works with no extra setup.
map:
  - config:rw
options: {}
schema: {}
startup: services
boot: auto
